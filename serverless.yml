# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ibrahim2003
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: e-homing
# "service" is the name of this project. This will also be added to your AWS resource names.
service: real-time-web-chat

provider:
  name: aws
  runtime: nodejs20.x
  websocketsApiRouteSelectionExpression: '$request.body.action'
  stackName: real-time-web-chat-dev
  environment:
    WSSAPIGATEWAYENDPOINT:
      Fn::Join:
        - ""
        - - "https://"
          - Ref: WebsocketsApi
          - ".execute-api."
          - Ref: AWS::Region
          - ".amazonaws.com/${sls:stage}"
    CLIENTS_TABLE: Clients
    MESSAGES_TABLE: Messages
    USERS_TABLE: Users
    COGNITO_USER_POOL_ID: { Ref: UserPool }
    COGNITO_CLIENT_ID: { Ref: UserPoolClient }
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com


  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - "dynamodb:PutItem"
            - "dynamodb:GetItem"
            - "dynamodb:DeleteItem"
            - "dynamodb:Scan"
          Resource:
            - { "Fn::GetAtt": ["ClientsTable", "Arn"] }
        - Effect: Allow
          Action:
            - "dynamodb:Query"
          Resource:
            Fn::Join:
              - "/"
              - - { "Fn::GetAtt": ["ClientsTable", "Arn"] }
                - "index"
                - "*"
        - Effect: Allow
          Action:
            - "dynamodb:PutItem"
            - "dynamodb:GetItem"
            - "dynamodb:DeleteItem"
            - "dynamodb:Scan"
            - "dynamodb:UpdateItem"
          Resource:
            - { "Fn::GetAtt": ["MessagesTable", "Arn"] }
        - Effect: Allow
          Action:
            - "dynamodb:Query"
          Resource:
            Fn::Join:
              - "/"
              - - { "Fn::GetAtt": ["MessagesTable", "Arn"] }
                - "index"
                - "*"
        - Effect: Allow
          Action:
            - "dynamodb:PutItem"
            - "dynamodb:GetItem"
          Resource:
            - { "Fn::GetAtt": ["UsersTable", "Arn"] }
        - Effect: Allow
          Action:
            - "dynamodb:Query"
          Resource:
            Fn::Join:
              - "/"
              - - { "Fn::GetAtt": ["UsersTable", "Arn"] }
                - "index"
                - "*"
        # Permissions for API Gateway Management API to send messages back to clients
        - Effect: Allow
          Action:
            - "execute-api:ManageConnections"
          Resource:
            Fn::Join:
              - ""
              - - "arn:"
                - Ref: AWS::Partition
                - ":execute-api:"
                - Ref: AWS::Region
                - ":"
                - Ref: AWS::AccountId
                - ":"
                - Ref: WebsocketsApi # This refers to the implicitly created WebSocket API
                - "/*"

functions:
  wsAuthorizer:
    handler: authorizer.handle

  websocketHandler:
    handler: handler.handle
    events:
      - websocket:
          route: $connect
          authorizer:
            name: wsAuthorizer
            identitySource:
              - "route.request.querystring.token"
      - websocket:
          route: $disconnect
      - websocket:
          route: $default
      - websocket:
          route: sendMessage
      - websocket:
          route: getClients
      - websocket:
          route: getSession
      - websocket:
          route: getMessages
      - websocket:
          route: typing
      - websocket:
          route: markRead



resources:
  Resources:
    ClientsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Clients
        BillingMode: PAY_PER_REQUEST # Recommended for unpredictable workloads like chat
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: nickname
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        GlobalSecondaryIndexes:
          - IndexName: NicknameIndex
            KeySchema:
              - AttributeName: nickname
                KeyType: HASH
            Projection:
              ProjectionType: "ALL"
    MessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Messages
        BillingMode: PAY_PER_REQUEST # Recommended for unpredictable workloads like chat
        AttributeDefinitions:
          - AttributeName: messageId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
          - AttributeName: nicknameToNickname
            AttributeType: S
        KeySchema:
          - AttributeName: messageId
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: NicknameToNicknameIndex
            KeySchema:
              - AttributeName: nicknameToNickname
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: "ALL"

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: sub
            AttributeType: S
          - AttributeName: nickname
            AttributeType: S
        KeySchema:
          - AttributeName: sub
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: NicknameIndex
            KeySchema:
              - AttributeName: nickname
                KeyType: HASH
            Projection:
              ProjectionType: "ALL"

    UserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: real-time-chat-users
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true

    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: real-time-chat-mobile
        UserPoolId: { Ref: UserPool }
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH

    ChatMediaBucket:
      Type: AWS::S3::Bucket
      Properties: {}

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node